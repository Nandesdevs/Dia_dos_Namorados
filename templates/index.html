<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia dos Namorados</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffebee;
            font-family: Arial, sans-serif;
        }
        .card {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #e91e63;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .btn-sim {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
        }
        .btn-nao {
            background: #9e9e9e;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ url_for('static', filename='imagens/Garfield_and_Snoop.png') }}" alt="Garfield and Snoop">
        <h1>Will you be my valentine?</h1>
        <div class="buttons">
            <button class="btn-sim" id="sim">Yes</button>
            <button class="btn-nao" id="nao">No</button>
        </div>
    </div>

    <script>
        const sim = document.getElementById('sim');
        const nao = document.getElementById('nao');
        let tamanhoSim = 1;

        nao.addEventListener('click', () => {
            tamanhoSim += 0.2;
            sim.style.transform = `scale(${tamanhoSim})`;
            sim.style.transition = 'transform 0.2s';
            nao.textContent = 'Não???';
        });
    </script>
</body>
</html>
