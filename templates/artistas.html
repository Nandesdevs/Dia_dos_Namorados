<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principais Artistas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style-artistas.css') }}">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='imagens_site_artistas/Layout_Site.png') }}");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- Título no topo com animação -->
    <div class="titulo-topo animacao-titulo">
        ⋆˚࿔ 𝕻𝖗𝖎𝖓𝖈𝖎𝖕𝖆𝖎𝖘 𝕬𝖗𝖙𝖎𝖘𝖙𝖆𝖘 𝕬𝖇𝖔𝖚𝖙 𝖚࿔˚⋆
    </div>
    
    <!-- Botão Next Page vertical -->
    <a href="/musicas" class="next-page">
        𝕹𝖊𝖝𝖙 𝕻𝖆𝖌𝖊
    </a>
    
    <!-- Polaroids com links -->
    <div class="polaroids-container">
        <!-- Polaroid 1: The Smiths -->
        <a href="https://open.spotify.com/artist/3yY2gUcIsjMr8hjo51PoJ8" target="_blank" class="polaroid-link polaroid-1">
            <div class="polaroid">
                <img src="{{ url_for('static', filename='imagens_site_artistas/polaroids/PolaroidTheSmiths.png') }}" alt="The Smiths">
            </div>
        </a>
        
        <!-- Detalhe: EstrelasCaneta -->

                <img src="{{ url_for('static', filename='imagens_site_artistas/polaroids/PolaroidTheCure.png') }}" alt="The Cure">
            </div>
